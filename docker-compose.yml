services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8010:8000"
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-unsafe-development-secret-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,100.108.207.111}
      DATABASE_URL: ${DATABASE_URL:-postgres://cube:cube@db:5432/cube}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cube}
      POSTGRES_USER: ${POSTGRES_USER:-cube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cube}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
