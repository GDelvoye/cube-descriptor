{% extends "base.html" %}

{% block title %}{{ title }} - Cube MTG Analyzer{% endblock %}

{% block content %}
  <p class="page-actions"><a href="{% url 'stats:query_list' %}">Retour aux requetes</a></p>
  <h1>{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sauvegarder</button>
  </form>
  <p>Exemples : <code>type:Creature AND text:"When this creature enters"</code>, <code>power=2 AND keyword:Flying</code>, <code>mv&lt;=2</code>.</p>
{% endblock %}
